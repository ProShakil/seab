<script setup>
import AdminLayout from '@/Layouts/AdminLayout.vue'
import { ref } from 'vue'
import { router } from '@inertiajs/vue3'
import Swal from 'sweetalert2'

const props = defineProps({
    users: Object,
    filters: Object
})

const search = ref(props.filters.search || '')

/* SEARCH */
const doSearch = () => {
    router.get(route('users.list'), {
        search: search.value
    }, {
        preserveState: true,
        replace: true
    })
}

/* DELETE USER */
const deleteUser = (id) => {
    Swal.fire({
        title: 'Are you sure?',
        text: "This action cannot be undone!",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#d33',
        cancelButtonColor: '#3085d6',
        confirmButtonText: 'Yes, delete it!'
    }).then((result) => {
        if (result.isConfirmed) {
            router.delete(route('users.destroy', id), {
                onSuccess: () => {
                    Swal.fire('Deleted!', 'User has been deleted.', 'success')
                }
            })
        }
    })
}
</script>

<template>
<AdminLayout>

    <div class="p-4">

        <!-- HEADER -->
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-bold">User List</h2>
        </div>

        <!-- SEARCH -->
        <div class="mb-4 flex gap-2">
            <input
                v-model="search"
                type="text"
                placeholder="Search by name or contact..."
                class="border p-2 rounded w-72"
            />

            <button
                @click="doSearch"
                class="bg-blue-600 text-white px-4 rounded"
            >
                Search
            </button>
        </div>

        <!-- TABLE -->
        <div class="overflow-x-auto bg-white shadow rounded-lg">
            <table class="w-full text-sm text-left">

                <thead class="bg-gray-100">
                    <tr>
                        <th class="p-3">SL</th>
                        <th class="p-3">Membership ID</th>
                        <th class="p-3">Image</th>
                        <th class="p-3">Name</th>
                        <th class="p-3">Contact No</th>
                        <th class="p-3">Technology</th>
                        <th class="p-3 text-center">View</th>
                        <th class="p-3 text-center">Edit</th>
                        <th class="p-3 text-center">Delete</th>
                    </tr>
                </thead>

                <tbody>
                    <tr
                        v-for="(user, index) in users.data"
                        :key="user.id"
                        class="border-b hover:bg-gray-50"
                    >

                        <!-- SL -->
                        <td class="p-3">{{ index + 1 }}</td>

                        <!-- Membership ID -->
                        <td class="p-3">{{ user.membership_id }}</td>

                        <!-- IMAGE -->
                        <td class="p-3">
                            <img
                                :src="user.image ? '/storage/' + user.image : '/default.png'"
                                class="w-10 h-10 rounded-full object-cover"
                            />
                        </td>

                        <!-- NAME -->
                        <td class="p-3">{{ user.name }}</td>

                        <!-- CONTACT -->
                        <td class="p-3">{{ user.contact_no }}</td>

                        <!-- TECHNOLOGY -->
                        <td class="p-3">
                            <span
                                v-for="tech in user.technologies"
                                :key="tech.id"
                                class="text-xs bg-blue-100 text-blue-700 px-2 py-1 rounded mr-1"
                            >
                                {{ tech.name }}
                            </span>
                        </td>

                        <!-- VIEW -->
                        <td class="p-3 text-center">
                            <a :href="route('users.show', user.id)" class="text-blue-600">
                                <span class="material-symbols-outlined text-lg">
                                    visibility
                                </span>
                            </a>
                        </td>

                        <!-- EDIT -->
                        <td class="p-3 text-center">
                            <a :href="route('users.edit', user.id)" class="text-green-600">
                                <span class="material-symbols-outlined text-lg">
                                    edit
                                </span>
                            </a>
                        </td>

                        <!-- DELETE -->
                        <td class="p-3 text-center">
                            <button @click="deleteUser(user.id)" class="text-red-600">
                                <span class="material-symbols-outlined text-lg">
                                    delete
                                </span>
                            </button>
                        </td>

                    </tr>

                    <tr v-if="users.data.length === 0">
                        <td colspan="9" class="p-4 text-center text-gray-500">
                            No users found
                        </td>
                    </tr>
                </tbody>

            </table>
        </div>

        <!-- PAGINATION -->
        <div class="mt-4 flex gap-2 flex-wrap">
            <button
                v-for="link in users.links"
                :key="link.label"
                v-html="link.label"
                @click="link.url && router.visit(link.url)"
                :class="[
                    'px-3 py-1 border rounded text-sm',
                    link.active ? 'bg-blue-600 text-white' : 'bg-white'
                ]"
            />
        </div>

    </div>

</AdminLayout>
</template>
